<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Alura Auto-Flow</title>
    <style>
        body {
            width: 280px;
            padding: 15px;
            background: #0f172a;
            color: #fff;
            font-family: sans-serif;
        }

        h3 {
            margin-bottom: 12px;
            color: #38bdf8;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-start {
            background: #3b82f6;
            color: white;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        #status {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h3>⚡ Alura Auto-Flow</h3>
    <button id="btnStart" class="btn btn-start">Iniciar</button>
    <button id="btnStop" class="btn btn-stop">Parar</button>
    <div id="status">Status: Parado</div>
    <script src="popup.js"></script>
</body>

</html>
